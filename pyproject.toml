[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memops"
version = "0.1.0"
description = "Observability and replay infrastructure for persistent AI memory systems."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Kedar Vartak" }
]
dependencies = []

[project.scripts]
memops = "memfs_doctor.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"memfs_doctor.dashboard" = ["static/*"]
